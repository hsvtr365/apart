services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: village
      POSTGRES_PASSWORD: village_local_only
      POSTGRES_DB: village
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - village_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U village -d village"]
      interval: 5s
      retries: 10
volumes:
  village_db:
