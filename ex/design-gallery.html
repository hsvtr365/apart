<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단지생활 — 디자인 탐색 10</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic",sans-serif;background:#eeefe9;color:#222b25}header{padding:40px 5vw 30px}header small{letter-spacing:3px;font-size:11px;color:#60715f}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-2px;margin:14px 0}header p{color:#6a746a;font-size:14px;line-height:1.8}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 5vw 24px}button,a{font:inherit;cursor:pointer}button{border:1px solid #d5dad0;border-radius:30px;padding:11px 18px;background:#fff;color:#52614f;font-size:13px}button.active{background:#283e30;color:#fff;border-color:#283e30}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #aa8050;outline-offset:3px}.grid{padding:0 5vw 50px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}.card{border:1px solid #d7dbd0;border-radius:14px;background:#fff;overflow:hidden}.card-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px}.card h2{font-size:17px;margin:0}.card small{display:block;margin-top:7px;color:#778173;font-size:11px}.number{font-family:monospace;font-size:12px;color:#94a08e;margin-right:8px}.open{font-size:12px;white-space:nowrap;border:1px solid #dce1d7;border-radius:7px;padding:9px 12px}.preview{height:360px;background:#edf0e7;overflow:hidden;border-top:1px solid #e8ebe2;position:relative;display:flex;justify-content:center}.viewport{width:1440px;min-width:1440px;height:1080px;transform:scale(.4);transform-origin:top center}.viewport iframe{width:100%;height:100%;border:0;background:#fff}.mobile .viewport{width:390px;min-width:390px;height:900px;transform:scale(.8)}.mobile .preview{height:720px}.card-foot{padding:14px 20px;font-size:12px;color:#74806d;line-height:1.7}.legend{margin-left:auto;font-size:11px;color:#7e8877}footer{padding:20px 5vw 35px;font-size:12px;color:#7e8877;border-top:1px solid #d8ddd1}[hidden]{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}.preview{height:310px}.viewport{transform:scale(.34)}.legend{width:100%;margin:5px 0 0}}@media(max-width:450px){header{padding-top:28px}.mobile .viewport{transform:scale(.75)}.mobile .preview{height:675px}.card-top{padding:16px 13px}.card h2{font-size:15px}.open{padding:8px}.viewport{transform:scale(.25)}.preview{height:270px}}
</style></head><body><header><small>NEIGHBORHOOD / DESIGN EXPLORATIONS</small><h1>같은 동네, 열 가지 시선.</h1><p>생활정보가 중심인 홈페이지 디자인 10안.<br>일상적인 화면부터 대담한 실험까지, 구조와 분위기를 함께 비교해보세요.</p></header><div class="controls"><button class="active" data-size="desktop">데스크톱 미리보기</button><button data-size="mobile">모바일 미리보기</button><button id="experimental">실험적인 안만</button><span class="legend">미리보기 안에서도 조작 가능 · 새 창에서 원본 크기 확인</span></div><main class="grid" id="grid"></main><footer>모든 안은 독립 HTML · 예시 데이터 · 로그인·지도 API·실제 저장 없음 · <a href="index.html">기존 디자인 보기 ↗</a></footer><script>
const designs=[['01-editorial','단지일보','크림 / 세리프 / 레드','신문처럼 읽는 오늘의 소식. 정보의 우선순위를 편집과 타이포로 보여줍니다.',false],['02-brutalist','동네, 크게 말하다','라임 / 굵은 선 / 큰 타이포','확실한 대비와 강한 형태로 현재 소식을 전면에 내세운 실험안.',true],['03-dark-console','단지 관제실','다크 / 앰버 / 대시보드','현재 상태와 확인 시각을 한눈에 모으는 야간 관제실.',true],['04-soft-garden','우리 동네 정원','민트 / 라벤더 / 부드러운 형태','친근한 색과 넉넉한 여백으로 편하게 읽는 생활정보.',false],['05-swiss','단지의 질서','흑백 / 레드 / 정렬','장식보다 명확한 글자와 정렬에 집중한 정보 디자인.',false],['06-chat-first','이웃의 메시지','대화 / 소식 카드 / 채팅 피드','단톡방에서 이어지는 듯한 익숙한 대화형 정보 화면.',false],['07-map-first','생활의 좌표','공간 / 지도 캔버스 / 위치 카드','장소를 먼저 탐색하는 지도 중심의 실험적 구조.',true],['08-retro-terminal','우리 단지 접속 중','그린 / 모노스페이스 / 터미널','레트로 인터페이스로 재해석한 하이퍼로컬 정보 피드.',true],['09-magazine','동네의 한 페이지','오렌지 / 삽화 / 매거진','우리 동네 소식을 지역 매거진처럼 펼치는 화면.',true],['10-timeline','오늘의 흐름','시간축 / 일정 / 현재 상태','지금과 다음 일을 시간의 흐름에 따라 읽는 구조.',false]];
const grid=document.querySelector('#grid');designs.forEach(([file,name,palette,description,experimental],i)=>{const card=document.createElement('article');card.className='card';card.dataset.experimental=experimental;card.innerHTML=`<div class="card-top"><div><h2><span class="number">${String(i+1).padStart(2,'0')}</span>${name}</h2><small>${palette}${experimental?' · 실험안':''}</small></div><a class="open" href="variants/${file}.html" target="_blank" rel="noopener">원본 열기 ↗</a></div><div class="preview"><div class="viewport"><iframe src="variants/${file}.html" title="${name} 디자인 미리보기" loading="lazy"></iframe></div></div><div class="card-foot">${description}</div>`;grid.append(card)});
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{grid.classList.toggle('mobile',button.dataset.size==='mobile');document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===button))});document.querySelector('#experimental').onclick=function(){this.classList.toggle('active');const only=this.classList.contains('active');this.textContent=only?'전체 디자인 보기':'실험적인 안만';document.querySelectorAll('.card').forEach(card=>card.hidden=only&&card.dataset.experimental!=='true')};
</script></body></html>
