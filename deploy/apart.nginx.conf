server {
    listen 80;
    listen [::]:80;
    server_name apart.jujeop.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/apart-acme; }
    location / { return 301 https://apart.jujeop.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apart.jujeop.com;
    ssl_certificate /etc/letsencrypt/live/apart.jujeop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apart.jujeop.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:28004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
